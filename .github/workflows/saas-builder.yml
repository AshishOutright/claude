# Laws in CI for the SaaS Builder and Smart Core: tests and laws:check on every pull request that touches them.
name: SaaS Builder

on:
  pull_request:
    paths:
      - "saas-builder/**"
      - "smart-core/**"
      - ".github/workflows/saas-builder.yml"
  push:
    branches: [main]
    paths:
      - "saas-builder/**"
      - "smart-core/**"

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: saas-builder
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: zip, pdo_sqlite

      - name: Install
        run: |
          composer install --no-interaction --prefer-dist
          cp .env.example .env
          php artisan key:generate

      - name: Laws
        run: php artisan laws:check

      - name: Tests
        run: php artisan test
